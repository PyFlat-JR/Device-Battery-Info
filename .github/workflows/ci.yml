name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # Several sources are Windows-only (Win32 power status, PnP/Bluetooth via PowerShell), so the
    # plugin only builds and runs its tests on Windows.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore DeviceBatteryInfo.slnx

      - name: Build
        run: dotnet build DeviceBatteryInfo.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test DeviceBatteryInfo.slnx --no-build --configuration Release --filter "Category!=Hardware"
