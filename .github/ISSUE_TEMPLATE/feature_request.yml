name: Feature request
description: Suggest an improvement that isn't about adding a new device.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >
        For a new device to support, use the "Device support request" template instead.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that the plugin doesn't support today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
